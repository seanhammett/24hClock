<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24-Hour Clock</title>
  <!-- Ignored by the extension, which uses the manifest's icons and is never
       linked to; both matter when the same folder is served as a website. -->
  <meta name="description" content="An analog clock with a 24-hour hour hand, shaded for daylight and night at your location.">
  <link rel="icon" href="icons/icon128.png">
  <link rel="stylesheet" href="css/newtab.css">
  <!-- Before the first paint, so an overridden theme never flashes the other
       one on the way in. See js/theme.js. -->
  <script src="js/theme.js"></script>
</head>
<body>
  <main class="clock-area">
    <svg id="clock" viewBox="0 0 440 440" role="img" aria-label="24-hour analog clock with day and night shading">
      <defs>
        <!-- The sun is drawn only where the face is in daylight and the moon
             only where it is in night, so each one is cut off by the edge of
             the slice it is crossing. daynight.js keeps both regions current. -->
        <clipPath id="clip-day">
          <path id="clip-day-path" d=""></path>
        </clipPath>
        <clipPath id="clip-night">
          <path id="clip-night-path" clip-rule="evenodd" d=""></path>
        </clipPath>
        <!-- Lit face of the moon, shaped to the current phase by moonphase.js.
             The half disc is whichever limb the sun is on; the ellipse is the
             terminator, its width falling to nothing at the quarters. Painted
             white it adds to the half (gibbous), black it bites into it
             (crescent). Both are upright in the mask's own frame, so the horns
             point straight up and down whatever the hour. -->
        <mask id="moon-crescent" maskUnits="userSpaceOnUse" x="-20" y="-20" width="40" height="40">
          <path id="moon-lit-half" d="" fill="#fff"></path>
          <ellipse id="moon-terminator" cx="0" cy="0" rx="15" ry="15" fill="#000"></ellipse>
        </mask>
      </defs>
      <!-- Base face: night is the default; the daylight wedge is painted on top -->
      <circle id="face-base" cx="220" cy="220" r="180" fill="#12233f"></circle>
      <path id="day-wedge" d="" fill="#e8ecf4" visibility="hidden"></path>
      <g id="sun-markers"></g>
      <!-- Current time, marked just outside the rim. Rotated by clock.js with
           the hour hand it echoes. -->
      <g id="now-marker">
        <circle cx="220" cy="34" r="3" class="now-marker"></circle>
      </g>
      <g id="minute-ticks"></g>
      <g id="ticks"></g>
      <!-- Two copies of the numerals, each clipped to one region, so a numeral
           straddling the day/night edge is drawn dark on the daylight side and
           light on the night side rather than picking one colour for the whole
           glyph. daynight.js sets the group fills. -->
      <g id="numerals-day" clip-path="url(#clip-day)"></g>
      <g id="numerals-night" clip-path="url(#clip-night)"></g>
      <!-- Wake/sleep lines: over the day/night fill, under the hands -->
      <g id="wake-sleep-lines"></g>
      <!-- One plain hour hand per additional location, built by locations.js.
           Below the real hour hand, which keeps the sun and moon and stays the
           one the eye goes to first. -->
      <g id="extra-hands"></g>
      <g id="hand-hour">
        <line x1="220" y1="238" x2="220" y2="128" stroke="#1c2742" stroke-width="9" stroke-linecap="round"></line>
        <line x1="220" y1="238" x2="220" y2="128" stroke="#e8ecf4" stroke-width="3" stroke-linecap="round"></line>
      </g>
      <!-- Sun and moon ride the hour hand, above the face and the hour hand it
           caps, but below the minute and second hands, which sweep over them.
           The clip lives on the outer group so its path stays in face
           coordinates while the inner group carries the position. -->
      <g id="hand-icons">
        <g clip-path="url(#clip-day)">
          <g id="sun-icon">
            <circle r="15" fill="#ebc363" stroke="#16233d" stroke-width="2.5"></circle>
          </g>
        </g>
        <g clip-path="url(#clip-night)">
          <g id="moon-icon">
            <!-- The dark side is painted a touch lighter than the night fill
                 rather than left transparent, so the whole disc reads against
                 the face and hides the hour hand behind it. The outline goes on
                 last so the crescent cannot cover it. -->
            <circle r="15" fill="#25395e"></circle>
            <circle r="15" fill="#f4f1e9" mask="url(#moon-crescent)"></circle>
            <circle r="15" fill="none" stroke="#16233d" stroke-width="2.5"></circle>
          </g>
        </g>
      </g>
      <g id="hand-minute">
        <line x1="220" y1="244" x2="220" y2="84" stroke="#1c2742" stroke-width="6" stroke-linecap="round"></line>
        <line x1="220" y1="244" x2="220" y2="84" stroke="#e8ecf4" stroke-width="2" stroke-linecap="round"></line>
      </g>
      <!-- The main location's name, written along the hour hand once there is
           a second location to tell it from. Above the hour and minute hands,
           so neither can cover it. -->
      <g id="hand-labels"></g>
      <!-- The second hand sweeps over everything, names included: it is the one
           thing on the dial that is always moving, and it has to stay findable. -->
      <g id="hand-second">
        <line x1="220" y1="252" x2="220" y2="58" stroke="#ff6b57" stroke-width="2" stroke-linecap="round"></line>
      </g>
      <circle id="hub" cx="220" cy="220" r="7" fill="#ff6b57" stroke="#1c2742" stroke-width="2"></circle>
    </svg>
    <div class="readout">
      <!-- Shown only while the simulator is driving the face, so a clock
           parked at some other moment can never be mistaken for a live one.
           The line under it says how far from now that moment is. -->
      <div id="sim-badge" class="sim-badge">
        <span class="sim-badge-pill">Simulated</span>
        <div id="sim-delta" class="sim-delta"></div>
      </div>
      <div id="digital" class="digital" aria-hidden="true"><span id="digital-main"></span><span id="digital-seconds" class="digital-seconds"></span></div>
      <div id="date-readout" class="date-readout"></div>
      <div id="location-readout" class="location-readout"></div>
    </div>
  </main>

  <!-- The sidebar's handle: one arrow, pointing the way the panel will go. -->
  <button id="sidebar-toggle" class="sidebar-toggle" type="button"
          aria-expanded="false" aria-controls="sidebar" title="Settings">
    <span class="chevron" aria-hidden="true">&#x2039;</span>
    <span class="visually-hidden">Toggle settings</span>
  </button>

  <aside id="sidebar" class="sidebar" aria-label="Settings">
    <h1>Location</h1>

    <div class="field">
      <div class="place-row">
        <select id="place-select" aria-label="Place"></select>
        <button id="fav-toggle" class="fav-toggle" type="button" aria-pressed="false" title="Add to favorites" disabled>&#9734;</button>
      </div>
    </div>

    <div class="coord-row">
      <div class="field">
        <label for="lat-input">Latitude</label>
        <input type="number" id="lat-input" min="-90" max="90" step="any" placeholder="48.8566" inputmode="decimal">
      </div>
      <div class="field">
        <label for="lon-input">Longitude</label>
        <input type="number" id="lon-input" min="-180" max="180" step="any" placeholder="2.3522" inputmode="decimal">
      </div>
    </div>
    <p id="input-error" class="error" role="alert" hidden></p>

    <!-- The times themselves are marked on the rim, so the panel does not
         repeat them. This says the one thing the rim cannot: that there is no
         sunrise or sunset today to mark. -->
    <p id="polar-note" class="polar-note" hidden></p>

    <!-- Everywhere else worth watching. Each one puts a plain hour hand on the
         face beside the main location's, turning with the same real clock; the
         time beside it is that location's own reading of the moment on show. -->
    <div class="loc-list">
      <div id="loc-rows" class="loc-rows"></div>
      <button type="button" id="loc-add" class="loc-add">+ Add location</button>
      <!-- How those hands are painted. Two buttons showing the thing itself
           rather than naming it: three dots in the first three colours of the
           palette, or three of the one navy the grayscale hands all share.
           locations.js fills the dots, so the palette stays in one place.
           Neither control is worth offering until there is a hand to paint or
           hide, so the row appears with the first one. -->
      <div class="loc-style" id="loc-style-field" hidden>
        <!-- Takes the hands off the face and leaves the list alone, for when
             the dial is wanted plain but the places are worth keeping. -->
        <button type="button" id="loc-hide" class="loc-hide" aria-pressed="false">
          Hide hands
        </button>
        <div class="loc-style-picker" role="group" aria-label="Additional hands">
          <button type="button" id="loc-style-colour" class="loc-style-btn"
                  aria-pressed="true" title="Colour">
            <span class="loc-dots" aria-hidden="true"></span>
            <span class="visually-hidden">Colour</span>
          </button>
          <button type="button" id="loc-style-mono" class="loc-style-btn"
                  aria-pressed="false" title="Grayscale">
            <span class="loc-dots" aria-hidden="true"></span>
            <span class="visually-hidden">Grayscale</span>
          </button>
        </div>
      </div>
      <p id="loc-error" class="error" role="alert" hidden></p>
    </div>

    <!-- The clock, at some moment other than this one. Its own block rather
         than part of Options below: those settings say how the clock is drawn,
         this one says which moment it is drawing — the orientation and
         everything else under Options apply just the same while it is on. The
         controls are folded away until it is switched on: they are a panel's
         worth on their own, and mean nothing while the clock is running live. -->
    <div class="simulator">
      <h2>Simulator</h2>
      <label class="checkbox-label sim-switch">
        <input type="checkbox" id="sim-active">
        Time Travel
      </label>
      <div id="sim-controls" class="sim-controls" hidden>
        <p class="sim-hint">
          Every hand on the face moves to the chosen moment, so the whole dial
          reads as one instant seen from every location.
        </p>

        <!-- A month at a time rather than a text field with a flyout: moving
             around the calendar is most of what the simulator is for, so the
             calendar is the control. The input behind it holds the value. -->
        <div class="field sim-field sim-date-field">
          <div class="field-title" id="sim-date-label">Date</div>
          <input type="date" id="sim-date" hidden>
          <div class="sim-cal">
            <div class="sim-cal-head">
              <button type="button" id="sim-cal-prev" class="sim-cal-nav"
                      aria-label="Previous month">&lsaquo;</button>
              <div id="sim-cal-title" class="sim-cal-title" aria-live="polite"></div>
              <button type="button" id="sim-cal-next" class="sim-cal-nav"
                      aria-label="Next month">&rsaquo;</button>
            </div>
            <div id="sim-cal-week" class="sim-cal-week" aria-hidden="true"></div>
            <div id="sim-cal-grid" class="sim-cal-grid" role="group"
                 aria-labelledby="sim-date-label"></div>
          </div>
        </div>
        <div class="field sim-field sim-time-row">
          <label for="sim-time">Time</label>
          <input type="time" id="sim-time">
          <button type="button" id="sim-now" class="sim-now">Now</button>
        </div>
        <!-- Scrub the whole day without leaving the slider: the time field and
             this stay in step, and both mean wall-clock time at the main
             place. Run off either end and it carries on into the next day. -->
        <div class="sim-scrub">
          <input type="range" id="sim-slider" min="0" max="1439" step="1" value="720"
                 aria-label="Time of day at the main location">
        </div>
      </div>
    </div>

    <div class="options">
      <h2>Options</h2>
      <fieldset class="option-group">
        <legend>Orientation</legend>
        <label class="checkbox-label">
          <input type="radio" name="orientation" id="orient-noon" value="noon" checked>
          12 noon at top
        </label>
        <label class="checkbox-label">
          <input type="radio" name="orientation" id="orient-centered" value="centered">
          Day &amp; night centered
        </label>
        <label class="checkbox-label">
          <input type="radio" name="orientation" id="orient-louis" value="louis">
          Louis&nbsp;XIV
        </label>
      </fieldset>
      <fieldset class="option-group">
        <legend>Clock face</legend>
        <label class="checkbox-label">
          <input type="checkbox" id="show-minute" checked>
          Show minute hand
        </label>
        <!-- Markers only mean anything with a minute hand to read against. -->
        <label class="checkbox-label checkbox-sub" id="minute-marks-row">
          <input type="checkbox" id="show-minute-marks">
          Show minute markers
        </label>
        <!-- The whole-hour ticks always stay; this is just the subdivisions. -->
        <label class="checkbox-label">
          <input type="checkbox" id="show-subhour-ticks" checked>
          Show half &amp; quarter hour ticks
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="show-second" checked>
          Show second hand
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="show-wake-sleep">
          Show wake / sleep times
        </label>
        <!-- Also shown for Louis XIV, which needs the window to orient the dial. -->
        <div id="wake-times" class="wake-times" hidden>
          <div class="field">
            <label for="wake-input">Wake up</label>
            <input type="time" id="wake-input" value="07:00">
          </div>
          <div class="field">
            <label for="bed-input">Bedtime</label>
            <input type="time" id="bed-input" value="23:00">
          </div>
        </div>
      </fieldset>
      <!-- A plain div, not a fieldset: with no legend there is no group name to
           give, and both controls below already carry their own label. -->
      <div class="option-group">
        <div class="field">
          <label for="theme-select">Appearance</label>
          <select id="theme-select">
            <option value="system">Match browser</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="override-newtab">
          Show the clock in every new tab
        </label>
      </div>
    </div>
  </aside>

  <script src="js/suncalc.js"></script>
  <script src="js/cities.js"></script>
  <script src="js/tz-lookup.js"></script>
  <script src="js/places.js"></script>
  <script src="js/store.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/moonphase.js"></script>
  <script src="js/daynight.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/locations.js"></script>
  <script src="js/simulator.js"></script>
</body>
</html>
